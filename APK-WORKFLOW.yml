name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt anlegen
        run: npx cap add android

      - name: App-Icon und Startbildschirm erzeugen
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1f2e24' --splashBackgroundColor '#1f2e24' || true

      - name: Web-App in das Android-Projekt kopieren
        run: npx cap sync android

      - name: APK bauen
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: APK zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: coach-tobys-baseball-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
