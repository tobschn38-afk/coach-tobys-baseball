name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Dateien holen
        uses: actions/checkout@v5

      - name: Projektordner finden
        run: |
          shopt -s dotglob
          if [ ! -f package.json ]; then
            SUB=$(dirname "$(find . -maxdepth 3 -name package.json -not -path './node_modules/*' | head -n 1)")
            if [ -z "$SUB" ] || [ "$SUB" = "." ]; then
              echo "::error::package.json wurde nicht gefunden. Bitte den INHALT des Ordners coach-tobys-baseball hochladen (www, assets, package.json, capacitor.config.json)."
              exit 1
            fi
            echo "Projekt liegt in $SUB, verschiebe es nach oben."
            cp -r "$SUB"/* .
          fi
          if [ ! -f www/index.html ]; then
            echo "::error::www/index.html fehlt. Bitte den Ordner www mit hochladen."
            exit 1
          fi
          ls -la

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK vorbereiten (auf GitHub vorinstalliert)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          ls "$SDK/platforms" || true
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null || true
            "$SM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || echo "::warning::sdkmanager konnte nicht nachinstallieren, nutze vorhandene Pakete."
          else
            echo "::warning::sdkmanager nicht gefunden, nutze vorhandene Pakete."
          fi

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund --omit=optional @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/splash-screen@7 @capacitor/status-bar@7

      - name: Android-Projekt anlegen
        run: npx cap add android

      - name: App-Icon erzeugen (optional)
        continue-on-error: true
        run: npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#1f2e24' --splashBackgroundColor '#1f2e24'

      - name: Web-App in das Android-Projekt kopieren
        run: npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: APK zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: coach-tobys-baseball-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
